---
layout: default
---

<article class="notes active" data-page="notes">
    <header>
        <a href="{{ site.baseurl }}/notes/" class="back-link" style="display:inline-flex;align-items:center;gap:6px;color:var(--orange-yellow-crayola);font-size:var(--fs-6);margin-bottom:16px;text-decoration:none;">
            <ion-icon name="arrow-back-outline"></ion-icon> Back to Notes
        </a>
        <h1 class="h2 article-title">{{ page.title }}</h1>
        <div class="blog-meta" style="margin-top:8px;">
            <p class="blog-category">{{ page.category }}</p>
            <span class="dot"></span>
            <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%b %d, %Y" }}</time>
        </div>
    </header>

    {% if page.image %}
    <figure class="blog-banner-box" style="margin:24px 0;border-radius:14px;overflow:hidden;">
        <img src="{{ page.image }}" alt="{{ page.title }}" loading="lazy" style="width:100%;object-fit:cover;">
    </figure>
    {% endif %}

    <section class="post-content" style="margin-top:24px;line-height:1.8;color:var(--light-gray);">
        {{ content }}
    </section>

    <!-- JSON-LD Structured Data: BlogPosting Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.excerpt | strip_html | strip_newlines | jsonify }},
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "author": {
        "@type": "Person",
        "name": "Kapil Pidhwani",
        "url": "https://kapilpidhwani.in"
      },
      "image": "{{ page.image | default: 'https://i.postimg.cc/JzBWVhW4/my-avatar.png' | absolute_url }}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ page.url | absolute_url }}"
      }
    }
    </script>
</article>

---
layout: default
---

<article class="portfolio active" data-page="portfolio">
    <header>
        <a href="{{ site.baseurl }}/portfolio/" class="back-link" style="display:inline-flex;align-items:center;gap:6px;color:var(--orange-yellow-crayola);font-size:var(--fs-6);margin-bottom:16px;text-decoration:none;">
            <ion-icon name="arrow-back-outline"></ion-icon> Back to Portfolio
        </a>
        <h2 class="h2 article-title">{{ page.title }}</h2>
        <div class="blog-meta" style="margin-top:8px;">
            <p class="blog-category">{{ page.category }}</p>
            {% if page.year %}<span class="dot"></span><time>{{ page.year }}</time>{% endif %}
        </div>
    </header>

    {% if page.image %}
    <figure class="blog-banner-box" style="margin:24px 0;border-radius:14px;overflow:hidden;">
        <img src="{{ page.image }}" alt="{{ page.title }}" loading="lazy" style="width:100%;object-fit:cover;">
    </figure>
    {% endif %}

    <section class="post-content" style="margin-top:24px;line-height:1.8;color:var(--light-gray);">
        {{ content }}
    </section>
</article>

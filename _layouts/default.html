<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PXGGS4FV');</script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{% if page.title %}{{ page.title }} — Kapil Pidhwani{% else %}Kapil Pidhwani — Marketing Strategist & Google Apprentice{% endif %}</title>
    <meta name="title" content="{% if page.title %}{{ page.title }} — Kapil Pidhwani{% else %}Kapil Pidhwani — Marketing Strategist & Google Apprentice{% endif %}">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <meta name="author" content="Kapil Pidhwani">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="{% if layout.name == 'post' or layout.name == 'project' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — Kapil Pidhwani{% else %}Kapil Pidhwani — Marketing Strategist & Google Apprentice{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <meta property="og:image" content="{{ page.image | default: 'https://i.postimg.cc/JzBWVhW4/my-avatar.png' | absolute_url }}">
    <meta property="og:site_name" content="Kapil Pidhwani">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} — Kapil Pidhwani{% else %}Kapil Pidhwani — Marketing Strategist & Google Apprentice{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <meta name="twitter:image" content="{{ page.image | default: 'https://i.postimg.cc/JzBWVhW4/my-avatar.png' | absolute_url }}">

    <!-- CSS & Favicon -->
    <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css">
    <link rel="shortcut icon" href="https://i.postimg.cc/9fqYVvxh/logo.png" type="image/x-icon">

    <!-- JSON-LD Structured Data: Person Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Kapil Pidhwani",
      "jobTitle": "Marketing Strategist & Google Apprentice",
      "url": "https://kapilpidhwani.in",
      "image": "https://i.postimg.cc/JzBWVhW4/my-avatar.png",
      "sameAs": [
        "https://www.linkedin.com/in/kapilpidhwani/",
        "https://www.instagram.com/kapildoesmarketing/"
      ],
      "knowsAbout": [
        "Marketing Strategy",
        "Go-to-Market (GTM) Execution",
        "Google Ads",
        "Data Analytics",
        "Google Apps Script",
        "Lead Generation"
      ]
    }
    </script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PXGGS4FV"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main>
        {% include sidebar.html %}

        <div class="main-content">
            {% include nav.html %}

            {{ content }}
        </div>
    </main>

    <script src="{{ site.baseurl }}/js/script.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>

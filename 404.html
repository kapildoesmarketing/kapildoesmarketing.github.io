<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Map of short URLs to destination links (Designed by Kapil Pidhwani)
    const redirects = {
      "/gurgaon": "https://google.com",
      "/mumbai": "https://google.com",
      "/pune": "https://google.com",
      "/ananta": "https://google.com",
      "/rmz": "https://google.com",
      "/carina": "https://google.com",
      "/kyoto": "https://google.com",
      "/omega": "https://google.com"
    };

    const path = window.location.pathname.replace(/\/$/, "").toLowerCase();
    if (redirects[path]) {
      window.location.replace(redirects[path]);
    } else {
      window.location.replace("/");
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
